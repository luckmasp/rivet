<!DOCTYPE html>
<html>
  <body>
  <style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #4ECDC4;
    background-image: radial-gradient(circle, #FFFFFF 1px, transparent 1px);
    background-size: 24px 24px;
    background-attachment: fixed;
  }

  .header {
    width: 100%;
    max-width: 900px;
    margin-top: 40px;
    display: flex;
    justify-content: center;
  }

  .header img {
    width: 100%;
    height: auto;
    border-radius: 12px;
  }

  .content {
    width: 100%;
    max-width: 900px;
    margin-top: 30px;
    padding: 30px;
    background: rgba(255,255,255,0.85);
    border-radius: 12px;
    backdrop-filter: blur(4px);
    box-sizing: border-box;
  }

  h1 {
    margin-top: 0;
    margin-bottom: 10px;
  }

  p {
    margin: 6px 0;
  }

  .hint {
    margin-top: 16px;
    font-size: 14px;
    opacity: 0.8;
  }

  a {
    color: #7A4419;
  }
  </style>

  <div class="header">
    <img src="header2.svg" alt="Header">
  </div>

  <div class="content">
    <h1>Page not found</h1>
    <p>Looks like you've wandered somewhere that doesn't exist on this site.</p>
    <p>It might be a broken link, a typo, or just a page I haven't made yet.</p>

    <p class="hint">Time to go back? <a href="https://rivetmc.uk">Click me to return.</a></p>

    <p class="hint">
      Or you can head over to the main site and explore from there:
      <br>
      <a href="https://rivetmc.uk">https://rivetmc.uk</a>
    </p>

    <p class="hint">
      <br>
      <a href="https://neocities.org/" target="_blank">
        <img src="/neocities.png" width="200" alt="Neocities">
      </a>
    </p>
  </div>

  </body>
</html>
